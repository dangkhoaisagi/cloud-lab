services:
  backend:
    image: dangkhoaisagi/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: "5000"
    restart: unless-stopped

  frontend:
    image: dangkhoaisagi/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped